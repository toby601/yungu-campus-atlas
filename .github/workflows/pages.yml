name: Publish campus map
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: node build.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Fetch official Pages deploy action
        uses: actions/checkout@v6
        with:
          repository: actions/deploy-pages
          ref: 368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
          path: .pages-action
          persist-credentials: false
      - id: deploy
        name: Deploy Pages with bounded artifact retries
        env:
          INPUT_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_NAME: github-pages
          INPUT_PREVIEW: 'false'
          INPUT_TIMEOUT: '600000'
          INPUT_ERROR_COUNT: '10'
          INPUT_REPORTING_INTERVAL: '5000'
        uses: ./.github/actions/deploy-pages
